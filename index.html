<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO ve Arama Motoru Ayarları -->
    <title>ART AI - Yapay Zeka Asistanı</title>
    <meta name="description" content="ART AI - Rana Nisa Topçu tarafından geliştirilen, çok dilli sohbet edebilen ve fotogerçekçi görseller üretebilen yapay zeka asistanı.">
    <meta name="keywords" content="ART AI, ART yapay zeka, Rana Nisa Topçu, yapay zeka çizim, fotoğraf üretme, AI sohbet">
    <meta name="author" content="Rana Nisa Topçu">
    <meta name="robots" content="index, follow">

    <!-- Sosyal Medya Önizleme Kartları (Open Graph) -->
    <meta property="og:title" content="ART AI - Yapay Zeka Asistanı">
    <meta property="og:description" content="Rana Nisa Topçu tarafından geliştirilen akıllı yapay zeka asistanı.">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1e1e2e; color: #cdd6f4; }
        body { display: flex; flex-direction: row; }
        
        #sidebar { 
            width: 250px; 
            min-width: 250px;
            background-color: #181825; 
            border-right: 1px solid #313244; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
        }
        
        #new-btn { 
            padding: 12px; 
            background-color: #89b4fa; 
            color: #11111b; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 15px; 
            width: 100%;
        }

        #history-title { font-size: 12px; color: #a6adc8; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { 
            padding: 10px; 
            background-color: #313244; 
            border-radius: 6px; 
            cursor: pointer; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            font-size: 14px; 
            color: #cdd6f4;
        }
        .history-item:hover { background-color: #45475a; }

        #chat-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100%;
            min-width: 0; 
            position: relative;
        }

        #messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding-bottom: 20px;
        }

        .msg { 
            max-width: 85%; 
            padding: 10px 14px; 
            border-radius: 12px; 
            font-size: 14px; 
            line-height: 1.4; 
            word-break: break-word; 
        }

        .user { align-self: flex-end; background-color: #89b4fa; color: #11111b; border-bottom-right-radius: 2px; }
        .anka { align-self: flex-start; background-color: #313244; color: #cdd6f4; border-bottom-left-radius: 2px; }
        
        .msg img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        #input-box { 
            display: flex; 
            padding: 10px; 
            background-color: #181825; 
            border-top: 1px solid #313244; 
            gap: 8px; 
            width: 100%;
            box-sizing: border-box;
        }

        #message-input { 
            flex: 1; 
            min-width: 0; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #45475a; 
            background-color: #313244; 
            color: #cdd6f4; 
            outline: none; 
            font-size: 14px;
        }

        #send-btn { 
            padding: 12px 16px; 
            background-color: #a6e3a1; 
            color: #11111b; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            white-space: nowrap; 
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { 
                width: 100%; 
                min-width: 100%;
                height: auto; 
                padding: 10px; 
                border-right: none; 
                border-bottom: 1px solid #313244; 
            }
            #history-list { max-height: 100px; }
            #chat-container { height: calc(100vh - 140px); }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button id="new-btn" onclick="startNewChat()">+ Yeni Sohbet</button>
        <div id="history-title">Geçmiş Sohbetler</div>
        <div id="history-list"></div>
    </div>

    <div id="chat-container">
        <div id="messages"></div>
        <div id="input-box">
            <input type="text" id="message-input" placeholder="ANKA'ya yazın veya bir şeyler çizmesini isteyin..." onkeypress="handleKey(event)">
            <button id="send-btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        const API_KEYS = [
            "AIzaSyAvrzFfzWqJZUNTck4JRQKV8jd5Es2kSEQ"
        ];

        let currentKeyIndex = 0;
        let currentChatId = null;
        let allChats = {};

        try {
            allChats = JSON.parse(localStorage.getItem('anka_chats') || '{}');
        } catch(e) {
            console.warn("Depolama erişimi engellendi, geçici hafıza kullanılıyor.", e);
        }

        window.onload = function() {
            renderHistory();
            startNewChat();
        };

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (!list) return;
            list.innerHTML = '';
            Object.keys(allChats).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = allChats[id].title || 'Sohbet';
                item.onclick = () => loadChat(id);
                list.appendChild(item);
            });
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            document.getElementById('messages').innerHTML = '';
        }

        function loadChat(id) {
            currentChatId = id;
            const container = document.getElementById('messages');
            container.innerHTML = '';
            const chat = allChats[id];
            if (chat && chat.messages) {
                chat.messages.forEach(m => {
                    appendMessage(m.sender, m.text, m.type, false);
                });
            }
        }

        function appendMessage(sender, text, type, save = true) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerHTML = `<strong>${sender}:</strong> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save && currentChatId) {
                if (!allChats[currentChatId]) {
                    allChats[currentChatId] = { title: text.replace(/<[^>]*>?/gm, '').substring(0, 20) + "...", messages: [], history: [] };
                }
                allChats[currentChatId].messages.push({ sender, text, type });
                try {
                    localStorage.setItem('anka_chats', JSON.stringify(allChats));
                } catch(e) {}
                renderHistory();
            }
        }

        async function requestGeminiAPI(historyData, attempt = 0) {
            if (attempt >= API_KEYS.length) {
                throw new Error("Tüm API anahtarlarının kotası doldu. Lütfen biraz bekleyip tekrar deneyin.");
            }

            const activeKey = API_KEYS[currentKeyIndex];

            const systemPrompt = "Seni kimin yaptığı sorulduğunda 'Benim geliştiricim Rana Nisa Topçu'dur.' de.\n" +
                "ÇOK ÖNEMLİ DİL KURALI: Kullanıcının mesaj yazdığı dili OTOMATİK TESPİT ET (İtalyanca, Türkçe, İngilizce, Almanca, Fransızca, İspanyolca, Rusça, Çince, Japonca, Korece, Yunanca vb.).\n" +
                "Yanıtının TAMAMINI, İSTİSNASIZ bir şekilde kullanıcının yazdığı dilde ve alfabede ver. Kullanıcı 'ciao' yazarsa yanıtın kesinlikle İtalyanca olmalıdır (örn: 'Ciao! Come posso aiutarti?'). Araya asla varsayılan İngilizce kelimeler karıştırma.\n\n" +
                "ÖNEMLİ GÖRSEL KURALI: Eğer kullanıcı hangi dilde olursa olsun resim, çizim, fotoğraf veya görsel yapılmasını/gösterilmesini isterse, " +
                "Cevap olarak SADECE '[IMAGE: <ingilizce_prompt>]' formatında çıktı ver.\n" +
                "Görsel isteğini anlayıp İngilizceye çevir ve sonuna 'photorealistic, 8k resolution, DSLR camera shot, highly detailed textures, realistic lighting' ekle.\n" +
                "Görsel isteklerinde metin içi başka HİÇBİR açıklama yazma.";

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: systemPrompt }]
                    },
                    contents: historyData
                })
            });

            const data = await response.json();

            if (data.error && (data.error.code === 429 || data.error.message.includes("quota"))) {
                currentKeyIndex = (currentKeyIndex + 1) % API_KEYS.length;
                return await requestGeminiAPI(historyData, attempt + 1);
            }

            return data;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('Sen', text, 'user');
            input.value = '';

            if (!allChats[currentChatId]) {
                allChats[currentChatId] = { title: text.substring(0, 20) + "...", messages: [], history: [] };
            }

            allChats[currentChatId].history.push({ role: "user", parts: [{ text: text }] });

            try {
                const data = await requestGeminiAPI(allChats[currentChatId].history);

                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text.trim();
                    
                    const imageMatch = reply.match(/\[IMAGE:\s*(.*?)\]/i);

                    if (imageMatch && imageMatch[1]) {
                        let englishPrompt = imageMatch[1].replace(']', '').trim();
                        
                        const encodedPrompt = encodeURIComponent(englishPrompt);
                        const seed = Math.floor(Math.random() * 100000);
                        
                        const imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux&enhance=true`;
                        
                        const imageHTML = `<img src="${imgUrl}" alt="Üretilen Görsel" onload="document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;">`;
                        
                        appendMessage('ART', imageHTML, 'anka');
                        allChats[currentChatId].history.push({ role: "model", parts: [{ text: reply }] });
                    } else {
                        allChats[currentChatId].history.push({ role: "model", parts: [{ text: reply }] });
                        appendMessage('ART', reply, 'anka');
                    }
                } else if (data.error) {
                    appendMessage('ART', 'Hata: ' + data.error.message, 'anka');
                } else {
                    appendMessage('ART', 'Yanıt alınamadı. Lütfen tekrar deneyin.', 'anka');
                }

            } catch (err) {
                appendMessage('ART', 'Hata: ' + err.message, 'anka');
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
